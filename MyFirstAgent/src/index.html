<!DOCTYPE html>
<html>
  <head>
    <title>我的第一个网页</title>
    <style>
      body {
        font-family: "Microsoft YaHei", sans-serif;
        background-color: #f5f5f5;
        color: #333;
        line-height: 1.8;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1 {
        color: #1a73e8;
        text-align: center;
        font-size: 32px;
        margin-bottom: 10px;
      }

      h2 {
        color: #333;
        font-size: 22px;
        border-bottom: 2px solid #1a73e8;
        padding-bottom: 8px;
        margin-top: 30px;
      }

      .intro {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 30px;
      }

      input {
        padding: 8px 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-right: 10px;
        width: 300px;
      }

      button {
        background-color: #1a73e8;
        color: #fff;
        border: none;
        padding: 10px 24px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
      }

      button:hover {
        background-color: #1557b0;
      }

      /* ===== 待办清单样式 ===== */

      /* 整个清单列表 */
      .todo-list {
        list-style: none;          /* 去掉默认的圆点 */
        padding: 0;
        margin-top: 20px;
      }

      /* 每一条待办项 */
      .todo-item {
        background-color: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 10px;
        display: flex;              /* 弹性布局：让内容和按钮左右排列 */
        justify-content: space-between;  /* 两端对齐 */
        align-items: center;        /* 垂直居中 */
      }

      /* 已完成的待办项：加删除线、变灰 */
      .todo-done {
        text-decoration: line-through;   /* 文字加删除线 */
        color: #999;                     /* 变灰色 */
      }

      /* 删除按钮：红色小按钮 */
      .delete-btn {
        background-color: #e53935;
        padding: 5px 12px;
        font-size: 13px;
        margin: 0;
      }

      .delete-btn:hover {
        background-color: #c62828;
      }

      /* 完成按钮：绿色小按钮 */
      .done-btn {
        background-color: #43a047;
        padding: 5px 12px;
        font-size: 13px;
        margin: 0;
        margin-right: 8px;
      }

      .done-btn:hover {
        background-color: #2e7d32;
      }

      /* 统计信息 */
      .stats {
        color: #666;
        font-size: 14px;
        margin-top: 15px;
      }

      /* 空状态提示 */
      .empty-tip {
        color: #999;
        text-align: center;
        padding: 30px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>我的编程学习之旅</h1>
      <p class="intro">Day 6 —— 数组 + 循环 + 动态待办清单</p>

      <!-- ===== 待办清单 ===== -->
      <h2>待办清单</h2>

      <!-- 输入区域 -->
      <input id="todoInput" type="text" placeholder="输入一项待办事项...">
      <button id="addBtn">添加</button>

      <!-- 统计信息 -->
      <p id="stats" class="stats"></p>

      <!-- 待办列表（由 JS 动态生成） -->
      <ul id="todoList" class="todo-list"></ul>
    </div>

    <script>
      // ==========================================
      // 待办清单功能
      // 用数组存储数据，用循环渲染页面
      // ==========================================

      // 用数组存储所有待办事项
      // 每个待办是一个"对象"，包含文字内容和是否完成
      let todos = [
        { text: "学习 HTML 基础", done: true },
        { text: "学习 CSS 样式", done: true },
        { text: "学习 JavaScript 基础", done: true },
        { text: "学习数组和循环", done: false },
        { text: "学习读代码和 Review", done: false }
      ];

      // 找到页面上的元素
      const todoInput = document.getElementById("todoInput");
      const addBtn = document.getElementById("addBtn");
      const todoList = document.getElementById("todoList");
      const stats = document.getElementById("stats");


      // ------------------------------------------
      // 渲染函数：把数组里的数据显示到页面上
      // 每次数据变化后都要调用这个函数来刷新页面
      // ------------------------------------------
      function renderTodos() {
        // 先清空列表，防止重复显示
        todoList.innerHTML = "";

        // 如果数组为空，显示提示
        if (todos.length === 0) {
          todoList.innerHTML = '<li class="empty-tip">暂无待办事项，添加一个吧！</li>';
          stats.textContent = "";
          return;    // return 表示"到此结束，下面的代码不执行了"
        }

        // 用 for 循环遍历数组，每个待办生成一个列表项
        for (let i = 0; i < todos.length; i++) {

          // 创建一个新的 <li> 元素
          const li = document.createElement("li");
          li.className = "todo-item";

          // 创建文字部分
          const textSpan = document.createElement("span");
          textSpan.textContent = todos[i].text;

          // 如果已完成，加上删除线样式
          if (todos[i].done === true) {
            textSpan.classList.add("todo-done");
          }

          // 创建按钮容器
          const btnGroup = document.createElement("span");

          // 创建"完成"按钮
          const doneBtn = document.createElement("button");
          doneBtn.textContent = todos[i].done ? "撤销" : "完成";
          doneBtn.className = "done-btn";
          doneBtn.addEventListener("click", function() {
            // 切换完成状态：true 变 false，false 变 true
            todos[i].done = !todos[i].done;
            renderTodos();    // 重新渲染页面
          });

          // 创建"删除"按钮
          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "删除";
          deleteBtn.className = "delete-btn";
          deleteBtn.addEventListener("click", function() {
            // 从数组中删除第 i 个元素
            // splice(从哪个位置开始, 删几个)
            todos.splice(i, 1);
            renderTodos();    // 重新渲染页面
          });

          // 把按钮放进按钮容器
          btnGroup.appendChild(doneBtn);
          btnGroup.appendChild(deleteBtn);

          // 把文字和按钮容器放进 <li>
          li.appendChild(textSpan);
          li.appendChild(btnGroup);

          // 把 <li> 放进 <ul> 列表
          todoList.appendChild(li);
        }

        // 更新统计信息
        let doneCount = 0;
        for (let i = 0; i < todos.length; i++) {
          if (todos[i].done === true) {
            doneCount = doneCount + 1;
          }
        }
        stats.textContent = "共 " + todos.length + " 项，已完成 " + doneCount + " 项";
      }


      // ------------------------------------------
      // 添加功能：点击按钮，把输入框的内容加到数组里
      // ------------------------------------------
      addBtn.addEventListener("click", function() {
        let newText = todoInput.value;

        // 如果输入框为空，不添加
        if (newText === "") {
          return;
        }

        // 把新待办添加到数组末尾
        todos.push({ text: newText, done: false });

        // 清空输入框
        todoInput.value = "";

        // 重新渲染页面
        renderTodos();
      });


      // ------------------------------------------
      // 按回车也能添加（不用每次都点按钮）
      // ------------------------------------------
      todoInput.addEventListener("keydown", function(event) {
        // event.key 是用户按下的键的名称
        if (event.key === "Enter") {
          addBtn.click();    // 模拟点击添加按钮
        }
      });


      // 页面加载时，先渲染一次
      renderTodos();
    </script>
  </body>
</html>
