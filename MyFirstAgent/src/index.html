<!DOCTYPE html>
<html>
  <head>
    <title>我的第一个网页</title>
  <!-- 引用外部 CSS 文件 -->
  <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>我的编程学习之旅</h1>
      <p id="quote" class="quote">“加载名言中...”</p>
      <p class="intro">Day 6 —— 数组 + 循环 + 动态待办清单</p>

      <!-- ===== 待办清单 ===== -->
      <h2>待办清单</h2>

      <!-- 输入区域 -->
      <input id="todoInput" type="text" placeholder="输入一项待办事项...">
      <button id="addBtn">添加</button>

      <!-- 统计信息 -->
      <p id="stats" class="stats"></p>

      <!-- 待办列表（由 JS 动态生成） -->
      <ul id="todoList" class="todo-list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
