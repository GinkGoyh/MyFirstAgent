<!DOCTYPE html>
<html>
  <head>
    <title>我的第一个网页</title>
  <!-- 引用外部 CSS 文件 -->
  <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- 暗黑模式切换按钮，固定在右上角 -->
    <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>

    <div class="container">
      <h1>待办清单</h1>
      <p id="quote" class="quote">“加载名言中...”</p>
      <p class="intro">记得去做。。。</p>

      <!-- ===== 待办清单 ===== -->
      <h2>待办清单</h2>

      <!-- 搜索框 -->
      <input id="searchInput" type="text" placeholder="搜索待办事项...">

      <!-- 输入区域 -->
      <input id="todoInput" type="text" placeholder="输入一项待办事项...">
      <button id="addBtn">添加</button>
      <button id="clearDoneBtn" class="clear-done-btn">清空已完成</button>

      <!-- 统计信息 -->
      <p id="stats" class="stats"></p>

      <!-- 待办列表（由 JS 动态生成） -->
      <ul id="todoList" class="todo-list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
